name: Deploy TaskTracker to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'techzickweb' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          if [ -z "${AZURE_WEBAPP_NAME}" ]; then
            echo "AZURE_WEBAPP_NAME is not set."
            exit 1
          fi

          if [ -z "${AZUREAPPSERVICE_PUBLISHPROFILE}" ]; then
            echo "AZUREAPPSERVICE_PUBLISHPROFILE secret is not configured."
            exit 1
          fi

          echo "Deploying to Azure App Service: ${AZURE_WEBAPP_NAME}"

      - name: Prepare deployment package
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x "data/tasks.json"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
